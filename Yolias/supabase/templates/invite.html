<div style="font-family:'DM Sans',Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#141413">
  <div style="font-size:20px;font-weight:700;letter-spacing:.02em;color:#cf2525">YOLIAS</div>
  <h1 style="font-family:Georgia,serif;font-size:24px;font-weight:600;margin:24px 0 8px">You've been invited to Yolias</h1>
  <p style="font-size:14px;line-height:1.55;color:#747470;margin:0 0 24px">A teammate invited you to their Yolias workspace. Click below to accept.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite"
     style="display:inline-block;padding:10px 18px;background:#cf2525;color:#ffffff;border-radius:7px;font-size:14px;font-weight:600;text-decoration:none">Continue to Yolias</a>
  <p style="font-size:12px;color:#8c8c87;margin:24px 0 0">If you didn't request this, you can ignore this email.</p>
</div>
