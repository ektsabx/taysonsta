# Local Supabase for Yolias — same structure as the Taysonsta BOS config,
# separate project id and ports (BOS uses 5442x, Yolias 5463x).
project_id = "yolias"

[api]
enabled = true
port = 54631
schemas = ["public", "graphql_public", "intel"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54632
shadow_port = 54630
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54639
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54633
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54634

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3200"
additional_redirect_urls = ["http://localhost:3200/auth/confirm", "http://127.0.0.1:3200/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Google sign-in / sign-up (final spec phase 2). Switched on by
# scripts/dev-local.sh when GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are in
# .env.local. Google Cloud → OAuth client → authorized redirect URI:
# http://127.0.0.1:54631/auth/v1/callback (local) / <project>.supabase.co/auth/v1/callback.
[auth.external.google]
enabled = "env(YOLIAS_GOOGLE_ENABLED)"
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

# Magic link only: no passwords are ever set, and the templates contain the
# link only (no numeric code).
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "30s"
otp_expiry = 3600

# Sign-in emails go through Resend (the Taysonsta account, D-111) when
# scripts/dev-local.sh finds a key; otherwise Inbucket catches them. The
# values come from Yolias/.env.local, which that script writes.
[auth.email.smtp]
enabled = "env(YOLIAS_SMTP_ENABLED)"
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(RESEND_FROM_EMAIL)"
sender_name = "Yolias"

[auth.email.template.magic_link]
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}رابط تسجيل الدخول إلى يولـياس{{ else }}Your Yolias sign-in link{{ end }}{{ else }}Your Yolias sign-in link{{ end }}"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}أكّد حسابك في يولـياس{{ else }}Confirm your Yolias account{{ end }}{{ else }}Confirm your Yolias account{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}دعوة للانضمام إلى يولـياس{{ else }}You've been invited to Yolias{{ end }}{{ else }}You've been invited to Yolias{{ end }}"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}أكّد بريدك الجديد في يولـياس{{ else }}Confirm your new Yolias email{{ end }}{{ else }}Confirm your new Yolias email{{ end }}"
content_path = "./supabase/templates/email_change.html"

# Security notice to the old address after an email change.
[auth.email.notification.email_changed]
enabled = true
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}تم تغيير بريدك في يولـياس{{ else }}Your Yolias email address was changed{{ end }}{{ else }}Your Yolias email address was changed{{ end }}"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}تم تفعيل المصادقة الثنائية{{ else }}Two-factor authentication enabled{{ end }}{{ else }}Two-factor authentication enabled{{ end }}"
content_path = "./supabase/templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "{{ if .Data.locale }}{{ if eq .Data.locale \"ar\" }}تم إيقاف المصادقة الثنائية{{ else }}Two-factor authentication disabled{{ end }}{{ else }}Two-factor authentication disabled{{ end }}"
content_path = "./supabase/templates/mfa_factor_unenrolled_notification.html"

# Two-factor authentication with an authenticator app (Settings → Account).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
