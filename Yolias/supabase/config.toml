# Local Supabase for Yolias — same structure as the Taysonsta BOS config,
# separate project id and ports (BOS uses 5442x, Yolias 5463x).
project_id = "yolias"

[api]
enabled = true
port = 54631
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54632
shadow_port = 54630
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54639
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54633
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54634

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3200"
additional_redirect_urls = ["http://localhost:3200/auth/confirm", "http://127.0.0.1:3200/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

# Magic link only: no passwords are ever set, and the templates contain the
# link only (no numeric code).
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "30s"
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Yolias sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your Yolias account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You've been invited to Yolias"
content_path = "./supabase/templates/invite.html"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
